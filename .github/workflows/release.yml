name: Create Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get module version
        id: version
        shell: pwsh
        run: |
          $manifest = Import-PowerShellDataFile ./documenter-azure-landingzone.psd1
          "version=$($manifest.ModuleVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Check if release exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Check if module version exists in PowerShell Gallery
        id: gallery
        shell: pwsh
        env:
          MODULE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $published = Find-Module `
              -Name 'documenter-azure-landingzone' `
              -RequiredVersion $env:MODULE_VERSION `
              -Repository PSGallery `
              -ErrorAction SilentlyContinue
          $exists = $null -ne $published
          "exists=$($exists.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish module to PowerShell Gallery
        if: steps.gallery.outputs.exists == 'false'
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PSGALLERY_API_KEY)) {
              throw 'Missing required GitHub Actions secret: PSGALLERY_API_KEY.'
          }

          Publish-Module `
              -Path . `
              -Repository PSGallery `
              -NuGetApiKey $env:PSGALLERY_API_KEY `
              -Verbose
